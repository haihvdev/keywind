<html lang="en">
  <head>
    <title>Sign in to </title>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="http://localhost:5173/src/index.css" rel="stylesheet">
    <script defer src="http://localhost:5173/src/index.ts" type="module"></script>
  </head>
  <body class="min-h-screen px-4 py-6 sm:py-10">
    <div class="relative z-10 flex min-h-[calc(100vh-3rem)] flex-col sm:min-h-[calc(100vh-5rem)]">
      <div class="flex w-full flex-1 items-center justify-center">
        <div class="w-full max-w-md space-y-6">
          <div class="space-y-6 rounded-2xl border border-slate-200/80 bg-white/85 p-6 shadow-xl shadow-slate-200/40 backdrop-blur-sm dark:border-slate-700/80 dark:bg-slate-900/85 dark:shadow-slate-950/40 sm:p-8">
            <div class="space-y-4">
              <div class="text-center text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">
                Keywind
              </div>
              <h1 class="text-center text-xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Forgot Your Password?</h1>
            </div>
            <div class="space-y-4">
              <div class="border border-red-200 bg-red-50 text-red-700 dark:border-red-900/70 dark:bg-red-950/40 dark:text-red-200 rounded-xl p-4 text-sm" role="alert">
                Example of an error message
              </div>
              <form class="m-0 space-y-4" method="post" action="loginAction">
                <div>
                  <label class="sr-only" for="username"> Email </label> <input autofocus required aria-invalid="false" class="block mt-1 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-primary-400 focus:outline-none focus:ring-4 focus:ring-primary-100 sm:text-sm dark:border-slate-700 dark:bg-slate-950/80 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-primary-500 dark:focus:ring-primary-500/20" id="username" name="username" placeholder="Email" type="text" autocomplete="email" value="Attempted Username">
                  <div class="mt-2 text-sm text-red-600 dark:text-red-400">
                  </div>
                </div>
                <div class="flex flex-col pt-4 space-y-2">
                  <button class="bg-primary-600 text-white shadow-sm hover:bg-primary-500 focus:ring-primary-500 px-4 py-2.5 text-sm font-medium relative flex w-full justify-center rounded-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-white transition-colors duration-200 dark:focus:ring-offset-slate-900" type="submit"> Submit </button>
                </div>
              </form>
              <form action="loginAction" method="post">
                <input name="tryAnotherWay" type="hidden" value="on"> <button class="bg-slate-100 text-slate-700 hover:bg-slate-200 hover:text-slate-900 focus:ring-slate-400 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 dark:hover:text-white px-4 py-2.5 text-sm font-medium relative flex w-full justify-center rounded-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-white transition-colors duration-200 dark:focus:ring-offset-slate-900" type="submit"> Try Another Way </button>
              </form>
            </div>
            <div class="space-y-4">
              Enter your username or email address and we will send you instructions on how to create a new password.
            </div>
          </div>
          <div class="flex justify-around">
            <a class="text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white text-sm inline-flex transition-colors" href="loginUrl"> « Back to Login </a>
            <div class="relative" x-data="{ open: false }">
              <button class="text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white inline-flex transition-colors" @click="open = true" type="button">
                <div class="flex items-center">
                  <span class="mr-1 text-sm">English</span>
                  <svg class="h-5 w-5" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path clip-rule="evenodd" d="M5.23017 7.20938C5.52875 6.92228 6.00353 6.93159 6.29063 7.23017L10 11.1679L13.7094 7.23017C13.9965 6.93159 14.4713 6.92228 14.7698 7.20938C15.0684 7.49647 15.0777 7.97125 14.7906 8.26983L10.5406 12.7698C10.3992 12.9169 10.204 13 10 13C9.79599 13 9.60078 12.9169 9.45938 12.7698L5.20938 8.26983C4.92228 7.97125 4.93159 7.49647 5.23017 7.20938Z" fill-rule="evenodd" />
                  </svg>
                </div></button>
              <div @click.away="open = false" class="absolute bottom-0 -left-4 mb-6 max-h-80 overflow-y-scroll rounded-xl border border-slate-200 bg-white/95 shadow-xl shadow-slate-200/50 backdrop-blur-sm dark:border-slate-700 dark:bg-slate-900/90 dark:shadow-slate-950/40" x-cloak x-show="open">
                <div class="px-4 py-2">
                  <a class="text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white text-sm inline-flex transition-colors" href="url"> Deutsch </a>
                </div>
                <div class="px-4 py-2">
                  <a class="text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white text-sm inline-flex transition-colors" href="url"> Français </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="pb-1 text-center text-sm text-slate-500 dark:text-slate-400">
        © 2026 vpdkbacninh.vn | haihv.vn
      </div>
    </div>
  </body>
</html>
