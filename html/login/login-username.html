                  </div>
                </div>

                </div>
              </form>
              <form action="loginAction" method="post">

                    </svg>
                  </div></a>
              </div>
            </div>
            <div class="space-y-4">
              <div class="text-center">
                New user? <a class="text-primary-600 hover:text-primary-500 dark:text-primary-400 dark:hover:text-primary-300 inline-flex transition-colors" href="registrationUrl"> Register </a>

            </div>
          </div>
